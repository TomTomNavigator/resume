name: Build CV

# Triggered on every push so the published CVs can never drift from the source
# YAML. The build is the single source of truth: PDF, DOCX, HTML and the landing
# page are all generated, never hand-edited.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent run. Deploys would otherwise race on the Pages artifact name.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RenderCV 2.4+ requires Python 3.12 or newer. Pinning 3.13 keeps the
      # local and CI outputs identical.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build all variants
        # Fails the job if any variant errors, if any PDF is missing, or if any
        # PDF has no extractable text layer. That last check is the point of the
        # whole exercise: the previous Jekyll setup produced image-only PDFs
        # that applicant tracking systems could not read.
        run: python scripts/build.py

      - name: Build landing page
        run: python scripts/site.py

      - name: Summarise
        run: python scripts/summary.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs-and-docx
          path: |
            dist/*/*.pdf
            dist/*/*.docx
            dist/*/*.md
          if-no-files-found: error

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Deploy landing page to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  release:
    # Downloadable PDFs are only attached to a tagged release. Day-to-day pushes
    # stay in the Pages deployment and the workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - run: python scripts/build.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*.pdf
            dist/*/*.docx
          generate_release_notes: true