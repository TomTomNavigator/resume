name: Commercial & GTM (EN)
lang: en

cv:
  headline: Director of Solutions Engineering — Commercial Owner, Central & Eastern Europe

  sections:

    Executive Summary:
      - |
        Commercial leader in enterprise software with 10+ years across pre-sales, solution
        architecture and people management. I lead Okta's Solutions Engineering organisation
        across Central & Eastern Europe in an acting Director of PreSales capacity, covering
        Germany, Austria, Switzerland, Italy and further CEE markets for both Okta and Auth0.
        I lead an organisation of 12 direct reports, restructured it into three specialised tracks, and
        remain directly engaged in strategic deals from first discovery through commercial close.

    Leadership Snapshot:

      - label: Team
        details: 12 direct reports covering Commercial, Enterprise and Strategic accounts; Core, Auth0 and EMEA Architect tracks
      - label: Largest deal
        details: Lead SE, largest Workforce deal in CEE at the time — **1.5M USD ARR**, owned through to close

      - label: Motion
        details: MEDDICC, discovery, pilot/PoC structuring, deal desk, pricing and licensing models
      - label: Track record
        details: "Two-time President's Club FY22/FY23; AvePoint #1 SE worldwide 2018; >200% of target 2019"

    Professional Experience:
      - __merge_key__: okta-leadership
        highlights:
          - "Lead the full CEE organisation in an **acting Director capacity** — **12 direct reports** across Commercial, Enterprise and Strategic accounts — owning regional PreSales strategy and operations across both the Okta and Auth0 business lines."
          - "Acted as lead Solutions Engineer on the largest Workforce Identity deal in the CEE region at the time — **1.5M USD ARR** — from discovery and architecture through security review to joint commercial close."
          - "Structured the **12-person organisation** into Core SE, Auth0 Specialist and EMEA-wide Solution Architect streams, raising specialist capacity against pipeline."
          - "Maintain direct customer exposure: participate in complex sales cycles and run high-stakes PoCs, rather than delegating the hardest deals entirely."
          - "Spearheaded hiring across regions including Switzerland and Italy, recruited 2 SEs via the **Okta SE Academy**, and drove commercial-qualification coaching for SEs across Core and Alliances teams."
          - "Two-time President's Club winner (FY22, FY23), alongside EMEA PreSales Rockstar (FY23) and Technical Hot Shot CEE (FY22)."
          - "Previously #1 Sales Engineer **worldwide** at AvePoint in 2018 (>200%), and over **200% of target** in 2019 (#2 worldwide)."

      - __merge_key__: avepoint-senior-se
        highlights:
          - "#2 Sales Engineer **worldwide** in 2019, at over **200% of target**."
          - "Trusted technical advisor for AvePoint and for the Microsoft product families I supported, including joint customer-facing positioning in competitive deals."
          - "Supported migration and governance conversations for customers moving from on-premises SharePoint to full Microsoft 365."

      - __merge_key__: avepoint-tsp
        highlights:
          - "#1 Sales Engineer **worldwide** in 2018."
          - "Owned the transition from on-premises DocAve Management to the AvePoint Online Services SaaS motion, shifting account work toward recurring subscription and ARR revenue."
          - "Ran technical discovery, scoping and PoC delivery for enterprise SharePoint and Microsoft 365 estates."

