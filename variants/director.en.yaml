      - __merge_key__: okta-leadership
        summary: |
          Direct Okta's Solutions Engineering organization across Central & Eastern Europe, operating at Director
          scope since February 2024. Steer regional PreSales strategy, capacity planning, and technical win rates
          across Commercial, Enterprise, and Strategic tiers while shaping the multi-product Okta and Auth0 GTM motion.
        highlights:
          - "Direct regional Solutions Engineering across **Central & Eastern Europe**, leading **12 direct reports** spanning Commercial, Enterprise, and Strategic customer segments for both Okta and Auth0."
          - "Function as the regional PreSales business owner: partnering with Sales AVPs and Regional Directors to align territory coverage, drive technical conversion, and forecast multi-product pipeline."
          - "Serve as executive technical sponsor and escalation authority for marquee CEE opportunities, accelerating multi-year enterprise agreements and resolving architectural blockers."
          - "Architected the regional talent progression framework, delivering internal promotions at every level (**Associate to SE, SE to Senior, Senior to Principal**) and establishing the CEE **SE Academy** talent pipeline."
          - "Spearheaded regional integration of Okta Workforce and Auth0 CIAM portfolios, ensuring cross-enablement and solution positioning against competitor platforms (regional Microsoft Compete lead)."
          - "Active external ambassador: public spokesperson, media interviews (*Der Aktionär*), and keynote speaker at CTO Craft, Oktane on the Road, and executive roundtables."

