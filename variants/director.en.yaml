        Solutions Engineering executive and regional leader with 10+ years driving enterprise pre-sales,
        cloud security architecture, and high-performance engineering organizations. Leading Okta's
        Solutions Engineering organization across Central & Eastern Europe, directing regional PreSales strategy
        and GTM execution for both Okta Workforce Identity and Auth0 Customer Identity Cloud. Proven record of
        scaling technical talent, partnering with sales leadership on multi-million-dollar ARR motions, and
        serving as executive sponsor for strategic accounts across DACH and CEE.

