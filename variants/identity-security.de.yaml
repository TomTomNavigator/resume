        Führungskraft für Identity und Security mit über 10 Jahren Erfahrung an der Schnittstelle
        von Enterprise-Vertrieb, Lösungsarchitektur und Teamführung. Ich leite den
        Solutions-Engineering-Bereich von Okta für Zentraleuropa in kommissarischer
        Director-of-PreSales-Funktion — für Deutschland, Österreich, die Schweiz, Italien sowie
        weitere CEE-Märkte, sowohl Okta als auch Auth0. Das Team habe ich von 5 auf 12 Personen
        aufgebaut und drei Karrierepfade etabliert: Core Solutions Engineers, Auth0-Spezialisten
        und EMEA-weite Solution Architects — mit Security-Architektur und technischer
        Glaubwürdigkeit als Kern der Rolle.

