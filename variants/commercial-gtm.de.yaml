  headline: Director of Solutions Engineering — Commercial Owner, Central & Eastern Europe

  sections:

    Kurzprofil:
      - |
        Vertriebsorientierte Führungskraft in Enterprise-Software mit über 10 Jahren Erfahrung in
        PreSales, Lösungsarchitektur und Teamführung. Ich leite den Solutions-Engineering-Bereich
        von Okta für Zentraleuropa in kommissarischer Director-of-PreSales-Funktion — für
        Deutschland, Österreich, die Schweiz, Italien sowie weitere CEE-Märkte, sowohl Okta als
        auch Auth0. Das Team habe ich von 5 auf 12 Personen aufgebaut, in drei spezialisierte
        Streams gegliedert und bleibe selbst in strategischen Deals von der ersten Discovery bis
        zum gemeinsamen Abschluss aktiv eingebunden.

